---
eda_credentials:
  - name: "Hub Decision Environment Container Registry"
    credential_type: Container Registry
    organization:
      name: Default
    inputs:
      host: aap.rh.lab
      password: redhat
      username: admin
      verify_ssl: false

  - name: "registry.redhat.io"
    credential_type: Container Registry
    organization: Default
    inputs:
      host: registry.redhat.io
      username: '{{ registry_redhat_io_username }}'
      password: '{{ registry_redhat_io_password }}'
      verify_ssl: true

  - name: "AAP"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: Default
    inputs:
      host: https://aap.rh.lab/api/controller/
      password: redhat
      username: admin
      verify_ssl: false

  - name: "ai-fw scm"
    credential_type: "Source Control"
    organization: Default
    inputs:
      username: "{{ github_pat.ai_fw.username }}"
      password: "{{ github_pat.ai_fw.token }}"

  - name: "checkpoint-azure scm"
    credential_type: "Source Control"
    organization: Default
    inputs:
      username: "{{ github_pat.cp_azure.username }}"
      password: "{{ github_pat.cp_azure.token }}"

  # ServiceNow sends the token as the Authorization header.
  - name: "checkpoint-azure servicenow event stream"
    credential_type: "ServiceNow Event Stream"
    organization: Default
    inputs:
      token: "{{ controller_secrets.cp_azure.event_stream_token }}"
      http_header_key: Authorization
