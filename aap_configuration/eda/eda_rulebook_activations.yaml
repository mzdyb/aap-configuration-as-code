---
eda_rulebook_activations:
  - name: Automatic network issues recovery
    organization: Default
    project: eda-for-networks
    rulebook: network-recovery.yml
    decision_environment: my-decision-environment
    eda_credentials: AAP
    restart_policy: never
    state: disabled

  - name: "AI FW - ServiceNow request"
    organization: Default
    project: ai-firewall-automation
    rulebook: 01_snow_request.yml
    decision_environment: de-supported-rhel9
    eda_credentials: AAP
    restart_policy: on-failure
    state: enabled

  - name: "AI FW - PR approved"
    organization: Default
    project: ai-firewall-automation
    rulebook: 02_pr_approved.yml
    decision_environment: de-supported-rhel9
    eda_credentials: AAP
    restart_policy: on-failure
    state: enabled

  - name: "AI FW - Change approved"
    organization: Default
    project: ai-firewall-automation
    rulebook: 03_chg_approved.yml
    decision_environment: de-supported-rhel9
    eda_credentials: AAP
    restart_policy: on-failure
    state: enabled

  # Webhook on port 5000 (AI FW activations use 5001-5003).
  - name: "infoblox - ServiceNow host requests"
    organization: Default
    project: infoblox-eda-servicenow
    rulebook: servicenow.yml
    decision_environment: de-supported-rhel9
    eda_credentials: AAP
    restart_policy: on-failure
    state: enabled
