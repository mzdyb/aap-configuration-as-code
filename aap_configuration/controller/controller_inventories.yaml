---
# Inventories only. All SCM inventory sources are defined in ONE place:
# controller_inventory_sources.yaml (single owner for source attributes like
# update_on_launch and credential).
controller_inventories:
  - name: checkpoint inventory
    organization: Default

  - name: cisco aci inventory
    organization: Default

  - name: Demo Inventory
    organization: Default
    hosts:
      - name: localhost
        variables: |
          ansible_connection: local
          ansible_python_interpreter: '{{ ansible_playbook_python }}'

  - name: EDA for networks inventory
    organization: Default

  - name: f5 big ip inventory
    organization: Default

  - name: paloalto inventory
    organization: Default

  - name: arista-avd-aap inventory
    organization: Default

  - name: network-cac inventory
    organization: Default

  - name: infoblox inventory
    organization: Default

  - name: AI FW inventory
    organization: Default

  - name: infoblox-eda-servicenow inventory
    organization: Default
