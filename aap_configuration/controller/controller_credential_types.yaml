---
controller_credential_types:
  - name: "cisco-aci"
    description: ""
    kind: "cloud"
    inputs:
      fields:
      - id: username
        type: string
        label: APIC Username
        secret: false
      - id: password
        type: string
        label: APIC Password
        secret: true
    injectors:
      env:
        ACI_PASSWORD: !unsafe '{{ password }}'
        ACI_USERNAME: !unsafe '{{ username }}'

  - name: "servicenow-instance"
    description: ""
    kind: "cloud"
    inputs:
      fields:
      - id: sn_host
        type: string
        label: SN Host
        secret: false
      - id: sn_username
        type: string
        label: SN Username
        secret: false
      - id: sn_password
        type: string
        label: SN Password
        secret: true
    injectors:
      env:
        SN_HOST: !unsafe '{{ sn_host }}'
        SN_PASSWORD: !unsafe '{{ sn_password }}'
        SN_USERNAME: !unsafe '{{ sn_username }}'

  - name: "github pat avd-aap"
    description: ""
    kind: "cloud"
    inputs:
      fields:
      - id: github_pat
        type: string
        label: GitHub PAT
        secret: true
    injectors:
      env:
        GITHUB_PAT: !unsafe '{{ github_pat }}'

  - name: "Infoblox Portal"
    description: ""
    kind: "cloud"
    inputs:
      fields:
      - id: infoblox_portal_api_key
        type: string
        label: Infoblox Portal API Key
        secret: true
      - id: infoblox_portal_url
        type: string
        label: Infoblox Portal URL
        secret: false
    injectors:
      env:
        INFOBLOX_PORTAL_KEY: !unsafe '{{ infoblox_portal_api_key }}'
        INFOBLOX_PORTAL_URL: !unsafe '{{ infoblox_portal_url }}'

  - name: "panos"
    description: ""
    kind: "cloud"
    inputs:
      fields:
      - id: panos_username
        type: string
        label: PAN-OS Username
        secret: false
      - id: panos_password
        type: string
        label: PAN-OS Password
        secret: true
    injectors:
      env:
        PANOS_USERNAME: !unsafe '{{ panos_username }}'
        PANOS_PASSWORD: !unsafe '{{ panos_password }}'

  - name: "openai-api"
    description: "OpenAI-compatible API key for LLM services"
    kind: "cloud"
    inputs:
      fields:
      - id: llm_api_key
        type: string
        label: LLM API Key
        secret: true
      - id: llm_base_url
        type: string
        label: LLM Base URL
        secret: false
      - id: llm_model
        type: string
        label: LLM Model
        secret: false
    injectors:
      env:
        LLM_API_KEY: !unsafe '{{ llm_api_key }}'
      extra_vars:
        llm_base_url: !unsafe '{{ llm_base_url }}'
        llm_model: !unsafe '{{ llm_model }}'

  - name: "github pat ai-fw"
    description: "GitHub PAT for AI firewall automation project"
    kind: "cloud"
    inputs:
      fields:
      - id: github_pat
        type: string
        label: GitHub PAT
        secret: true
    injectors:
      env:
        GITHUB_TOKEN: !unsafe '{{ github_pat }}'
