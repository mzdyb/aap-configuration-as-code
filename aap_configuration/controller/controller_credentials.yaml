---
controller_credentials:
  - name: aap.rh.lab
    organization: "Default" 
    credential_type: Machine
    inputs:
      username: mzdyb
      password: "{{ controller_secrets['aap.rh.lab']['password'] }}"

  - name: "Demo Credential"
    organization: "Default" 
    credential_type: "Machine"
    inputs:
      username: admin

  - name: servicenow_instance
    organization: "Default"
    credential_type: servicenow-instance
    inputs:
      sn_username: "{{ controller_secrets['servicenow_instance']['username'] }}"
      sn_host: "{{ controller_secrets['servicenow_instance']['host'] }}"
      sn_password: "{{ controller_secrets['servicenow_instance']['password'] }}"

  - name: "EDA for networks Arista credentials"
    organization: "Default" 
    credential_type: "Machine"
    inputs:
      username: admin
      password: "{{ controller_secrets['eda_arista']['password'] }}"

  - name: "sandboxapicdc.cisco.com"
    organization: "Default" 
    credential_type: "cisco-aci"
    inputs:
      username: admin
      password: "{{ controller_secrets['sandboxapicdc']['password'] }}"

  - name: "github pat avd-aap"
    organization: "Default"
    credential_type: "github pat avd-aap"
    inputs:
      github_pat: "{{ github_pat.avd_aap }}"

  - name: "registry.redhat.io"
    organization: "Default" 
    credential_type: "Container Registry"
    inputs:
      host: "https://registry.redhat.io"
      username: "{{ registry_redhat_io_username }}"
      password: "{{ registry_redhat_io_password }}"
      verify_ssl: true

  - name: "Infoblox Portal"
    organization: "Default"
    credential_type: "Infoblox Portal"
    inputs:
      infoblox_portal_url: "https://csp.infoblox.com"
      infoblox_portal_api_key: "{{ infoblox_portal_api_key }}"

  - name: "panos"
    organization: "Default"
    credential_type: "panos"
    inputs:
      panos_username: "{{ controller_secrets['panos']['username'] }}"
      panos_password: "{{ controller_secrets['panos']['password'] }}"

  - name: "openai-api"
    organization: "Default"
    credential_type: "openai-api"
    inputs:
      llm_api_key: "{{ controller_secrets['openai-api']['ai_fw']['llm_api_key'] }}"
      llm_base_url: "{{ controller_secrets['openai-api']['ai_fw']['llm_base_url'] }}"
      llm_model: "{{ controller_secrets['openai-api']['ai_fw']['llm_model'] }}"

  - name: "github pat ai-fw"
    organization: "Default"
    credential_type: "github pat ai-fw"
    inputs:
      github_pat: "{{ github_pat.ai_fw.token }}"

  - name: "ai-fw panos"
    organization: "Default"
    credential_type: "panos"
    inputs:
      panos_username: "{{ controller_secrets['panos']['ai_fw']['username'] }}"
      panos_password: "{{ controller_secrets['panos']['ai_fw']['password'] }}"

  - name: "ai-fw scm"
    organization: "Default"
    credential_type: "Source Control"
    inputs:
      username: "{{ github_pat.ai_fw.username }}"
      password: "{{ github_pat.ai_fw.token }}"

  - name: "checkpoint"
    organization: "Default"
    credential_type: "Machine"
    inputs:
      username: admin
      password: "{{ controller_secrets['checkpoint']['password'] }}"

  - name: "checkpoint-azure azure rm"
    organization: "Default"
    credential_type: "Microsoft Azure Resource Manager"
    inputs:
      subscription: "{{ controller_secrets['cp_azure']['subscription'] }}"
      tenant: "{{ controller_secrets['cp_azure']['tenant'] }}"
      client: "{{ controller_secrets['cp_azure']['client'] }}"
      secret: "{{ controller_secrets['cp_azure']['secret'] }}"

  # Also the admin password that the deploy playbook sets on a new VM.
  - name: "checkpoint-azure check point api"
    organization: "Default"
    credential_type: "Check Point API"
    inputs:
      username: admin
      password: "{{ controller_secrets['cp_azure']['checkpoint_password'] }}"

  # Keeps the public IPs out of the public repository.
  - name: "checkpoint-azure access ips"
    organization: "Default"
    credential_type: "Management access IPs"
    inputs:
      automation_ip: "{{ controller_secrets['cp_azure']['automation_ip'] }}"
      admin_ip: "{{ controller_secrets['cp_azure']['admin_ip'] }}"

  - name: "checkpoint-azure scm"
    organization: "Default"
    credential_type: "Source Control"
    inputs:
      username: "{{ github_pat.cp_azure.username }}"
      password: "{{ github_pat.cp_azure.token }}"
